<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Check Queue - Vivivalen Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           BASE — โทนพาสเทลครีม + ลายทาง
        ============================================================ */
        * { box-sizing: border-box; }
        body {
            font-family: 'Mali', cursive;
            background-color: #FFF0F2; /* เปลี่ยนเป็นชมพูขาวนวล */
            background-image: repeating-linear-gradient(
                90deg, #FFF0F2 0px, #FFF0F2 20px, #FFE4E8 20px, #FFE4E8 40px
            );
            background-attachment: fixed;
            color: #3D1028; margin: 0; padding: 0;
        }
        .glass-card {
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.03);
            backdrop-filter: blur(4px);
            width: 100%;
        }
        .responsive-card { max-width: 350px; }
        @media (min-width:1024px) { .responsive-card { max-width:100%; } }

        /* Filter switch */
        .filter-wrapper {
            background:rgba(255,255,255,0.4); border-radius:999px;
            padding:4px; display:inline-flex; position:relative; width:180px;
        }
        .filter-btn { position:relative; z-index:10; flex:1; padding:4px 0; font-size:14px; font-weight:bold; text-align:center; cursor:pointer; }
        .filter-active-bg {
            position:absolute; top:4px; left:4px; height:calc(100% - 8px);
            width:calc(50% - 4px); background:white; border-radius:999px;
            box-shadow:0 3px 8px rgba(0,0,0,0.08); transition:all 0.3s cubic-bezier(0.4,0,0.2,1); z-index:5;
        }
        .text-active-all  { color:#8B4A5C !important; }
        .text-active-sent { color:#5B9373 !important; }
        .text-inactive    { color:#94A3B8; }

        /* Receipt */
        .receipt-card {
            background:white; border-radius:4px; padding:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            position:relative; font-size:10px; line-height:1.2; width:240px;
        }
        .receipt-card::before {
            content:""; position:absolute; top:-5px; left:0; right:0; height:10px;
            background-image:radial-gradient(circle,transparent 70%,white 70%);
            background-size:10px 10px; background-position:center;
        }
        @media (min-width:1024px) { .receipt-card { width:420px; padding:40px; font-size:14px; } }

        /* Admin visibility */
        .admin-only  { display: none !important; }
        .user-only   { display: flex; }
        .is-admin .admin-only { display: flex !important; }
        .is-admin .user-only  { display: none !important; }

        /* Status pill */
        .admin-status-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 14px 5px 10px; border-radius: 999px;
            font-size: 11px; font-weight: 700; font-style: italic;
            position: relative; border: none; cursor: pointer;
            white-space: nowrap; letter-spacing: 0.01em;
        }
        .s-working { background:#FFE4E8; color:#8B4A5C; }
        .s-waiting { background:#E8F0E3; color:#6B8E5E; }
        .s-done    { background:#DDE8E0; color:#5B9373; }
        .status-select-overlay {
            position:absolute; inset:0; opacity:0; cursor:pointer; width:100%;
            font-family:'Mali',cursive;
        }
        .status-lines { display:flex; flex-direction:column; gap:2.5px; flex-shrink:0; }
        .status-lines span { display:block; height:1.5px; border-radius:2px; background:currentColor; opacity:0.8; }
        .sl-short { width:4px; }
        .sl-long  { width:10px; }

        .admin-edit-tool { display:none; }
        .is-admin .admin-edit-tool { display:inline-block; }
        .is-admin [contenteditable="true"] {
            border-bottom:1px dashed #C9768A; outline:none;
            background:rgba(255,200,210,0.4); min-width:30px;
        }

        .badge-working { background:#FFE4E8; color:#8B4A5C; }
        .badge-waiting { background:#F3F4F6; color:#6B7280; }
        .badge-done    { background:#E7F5EC; color:#5B9373; }

        #glass-popup {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(10px);
            z-index: 2000; align-items: center; justify-content: center;
        }
        @keyframes popIn {
            from { transform: scale(0.72) translateY(16px); opacity: 0; }
            to   { transform: scale(1)    translateY(0);    opacity: 1; }
        }
        .popup-box {
            background: white; border-radius: 28px;
            padding: 32px 28px 26px; text-align: center;
            max-width: 270px; width: 90%;
            box-shadow: 0 24px 60px rgba(0,0,0,0.14);
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .popup-box[data-type="success"] { background: linear-gradient(160deg,#FFE4E8 0%,#FFFFFF 55%); }
        .popup-box[data-type="error"]   { background: linear-gradient(160deg,#FFF5F5 0%,#FFFFFF 55%); }
        .popup-box[data-type="warning"] { background: linear-gradient(160deg,#FFFBF0 0%,#FFFFFF 55%); }
        #popup-icon-wrap {
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; font-size: 30px; background: #F3F4F6;
        }
        .popup-box[data-type="success"] #popup-icon-wrap {
            background: linear-gradient(135deg,#FFC8D2,#FFB6C1);
            box-shadow: 0 8px 24px rgba(201,118,138,0.3);
        }
        .popup-box[data-type="error"] #popup-icon-wrap {
            background: linear-gradient(135deg,#FECACA,#FCA5A5);
            box-shadow: 0 8px 24px rgba(239,68,68,0.2);
        }
        .popup-box[data-type="warning"] #popup-icon-wrap {
            background: linear-gradient(135deg,#FDE68A,#FCD34D);
            box-shadow: 0 8px 24px rgba(251,191,36,0.25);
        }
        #popup-title {
            font-size: 16px; font-weight: bold; color: #3D1028; margin: 0 0 20px;
        }
        #popup-close-btn {
            background: linear-gradient(135deg,#C9768A,#D47890);
            color: white; border: none; padding: 12px 0; width: 100%;
            border-radius: 999px; font-size: 13px; font-weight: bold;
            cursor: pointer; font-family: 'Mali', cursive;
            box-shadow: 0 6px 18px rgba(201,118,138,0.3); transition: transform 0.15s;
        }
        #popup-close-btn:active { transform: scale(0.96); }

        .skeleton {
            background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
            background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px;
        }
        @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

        /* Mobile Navbar */
        #main-nav {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            background:rgba(255,255,255,0.95); border-radius:24px;
            padding:10px 24px; box-shadow:0 8px 32px rgba(0,0,0,0.08);
            display:flex; justify-content:space-around; align-items:center;
            z-index:100; border:1px solid rgba(255,255,255,0.6);
            width:88%; max-width:320px; transition:max-width 0.3s ease;
        }
        #main-nav a {
            display:flex; flex-direction:column; align-items:center;
            color:#9CA3AF; text-decoration:none; min-width:44px;
        }
        #main-nav a.active { color:#C9768A; }

        /* ════════════════════════════════════════════════════
           💻 DESKTOP/iPAD LAYOUT (1024px+)
           ════════════════════════════════════════════════════ */
        @media (max-width: 1023px) {
            .desktop-sidebar { display: none !important; }
            .desktop-layout { display: block !important; }
        }

        @media (min-width: 1024px) {
            /* body padding = 0 เพราะ sidebar เป็น fixed */
            body { padding: 0 !important; }
            #check-body { padding: 0 !important; }
            
            /* ซ่อน mobile navbar */
            #main-nav { display: none !important; }

            /* ─── LEFT SIDEBAR ─── */
            .desktop-sidebar {
                position: fixed;
                top: 20px; left: 20px; bottom: 20px;
                width: 72px;
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(12px);
                border-radius: 24px;
                padding: 20px 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                box-shadow: 0 8px 32px rgba(201,118,138, 0.1);
                z-index: 50;
                border: 1px solid rgba(255, 255, 255, 0.6);
            }
            .desktop-sidebar .sidebar-logo {
                width: 44px; height: 44px; border-radius: 50%;
                background: linear-gradient(135deg, #FFC8D2, #FFB6C1);
                display: flex; align-items: center; justify-content: center;
                margin-bottom: 16px;
                border: 2px solid white;
                color: #8B4A5C;
            }
            .desktop-sidebar a, .desktop-sidebar button.sidebar-btn {
                width: 44px; height: 44px;
                border-radius: 12px;
                display: flex; align-items: center; justify-content: center;
                color: #9CA3AF;
                background: transparent;
                border: none;
                cursor: pointer;
                transition: all 0.2s;
                text-decoration: none;
            }
            .desktop-sidebar a:hover, .desktop-sidebar button.sidebar-btn:hover {
                background: #FFC8D2;
                color: #C9768A;
            }
            .desktop-sidebar a.active {
                background: #FFC8D2;
                color: #8B4A5C;
            }
            .desktop-sidebar #logout-btn-sidebar {
                margin-top: auto;
                color: #EF4444;
            }
            .desktop-sidebar #logout-btn-sidebar:hover {
                background: #FEE2E2;
            }

            /* ─── MAIN CONTENT AREA ─── */
            .max-w-6xl {
                max-width: 100% !important;
                padding-left: 112px;
                padding-right: 20px;
                padding-top: 20px;
                padding-bottom: 30px;
            }

            /* ─── SEARCH BAR on desktop ─── */
            .search-wrap {
                max-width: 600px !important;
            }
            .search-wrap input {
                font-size: 16px !important;
                transform: none !important;
            }

            /* ─── Task List: 2 columns grid on desktop ─── */
            #task-container {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
            
            .responsive-card {
                max-width: 100% !important;
            }
            
            /* ─── การ์ด compact บน desktop ─── */
            .responsive-card .text-3xl {
                font-size: 36px !important;
            }
            .responsive-card .text-base {
                font-size: 16px !important;
            }

            /* Receipt area ตรงกลาง */
            #receipt-area {
                justify-content: center;
            }
        }
    </style>
</head>

// ─── STATE ────────────────────────────────────
const isAdmin = sessionStorage.getItem('isAdmin') === 'true' || localStorage.getItem('vvs_admin_token') === 'true';
let allQueues       = [];
let currentFilter   = 'all';
let currentReceiptId = null;

// ─── ADMIN SESSION ────────────────────────────
function applyAdminUI() {
    if (!isAdmin) return;
    document.getElementById('check-body').classList.add('is-admin');
    // Mobile navbar
    document.getElementById('admin-nav-btn').style.display = 'flex';
    document.getElementById('logout-btn').style.display = 'flex';
    document.getElementById('main-nav').style.maxWidth = '420px';
    // Desktop sidebar
    const adminSide = document.getElementById('admin-sidebar-link');
    const logoutSide = document.getElementById('logout-btn-sidebar');
    if (adminSide) adminSide.style.display = 'flex';
    if (logoutSide) logoutSide.style.display = 'flex';
}

function logout() {
    sessionStorage.removeItem('isAdmin');
    localStorage.removeItem('vvs_admin_token');
    location.reload();
}

// ─── POPUP ────────────────────────────────────
function showPopup(icon, msg) {
    const box = document.getElementById('popup-box');
    if (icon.includes('✅'))      box.dataset.type = 'success';
    else if (icon.includes('❌')) box.dataset.type = 'error';
    else if (icon.includes('⚠️')) box.dataset.type = 'warning';
    else                          box.dataset.type = '';
    document.getElementById('popup-icon').innerText  = icon;
    document.getElementById('popup-title').innerText = msg;
    box.style.animation = 'none'; box.offsetHeight; box.style.animation = '';
    document.getElementById('glass-popup').style.display = 'flex';
}
function closePopup() { document.getElementById('glass-popup').style.display = 'none'; }

// ─── FORMAT HELPERS ───────────────────────────
function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
}
function fmtTime(d) {
    if (!d) return '—';
    const dt = new Date(d);
    return String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0') + ' น.';
}

// ─── LOAD ALL QUEUES ──────────────────────────
async function loadAllQueues() {
    const { data, error } = await sb.from('queues').select('*').order('created_at',{ascending:true});
    document.getElementById('skel1')?.remove();
    if (error) {
        console.error('Supabase error:', error);
        showPopup('❌','โหลดข้อมูลไม่สำเร็จ: ' + error.message);
        return;
    }
    allQueues = data || [];
    renderList();
}

// ─── RENDER LIST ──────────────────────────────
function renderList() {
    const input = document.getElementById('search-input').value.trim().toUpperCase();
    const container = document.getElementById('task-container');

    let filtered = allQueues.filter(q => q && q.queue_number);

    if (currentFilter === 'all')  filtered = filtered.filter(q => q.status !== 'done');
    else                           filtered = filtered.filter(q => q.status === 'done');

    if (input && (input.startsWith('Q') || !isNaN(input))) {
        filtered = filtered.filter(q => q.queue_number && q.queue_number.toUpperCase().includes(input));
    }

    try {
        const statusOrder = { working: 0, waiting: 1, done: 2 };
        filtered = [...filtered].sort((a, b) => {
            const sa = statusOrder[a.status] ?? 99;
            const sb = statusOrder[b.status] ?? 99;
            if (sa !== sb) return sa - sb;
            const na = parseInt(String(a.queue_number || '').replace(/\D/g, '')) || 0;
            const nb = parseInt(String(b.queue_number || '').replace(/\D/g, '')) || 0;
            return na - nb;
        });
    } catch (e) {
        console.error('Sort failed:', e);
    }

    container.innerHTML = '';

    if (filtered.length === 0) {
        container.innerHTML = `<div class="glass-card responsive-card p-8 text-center text-gray-400 text-sm col-span-2">ไม่พบข้อมูลคิว</div>`;
    } else {
        filtered.forEach((q, i) => {
            try {
                container.appendChild(buildTaskCard(q));
            } catch (e) {
                console.error('buildTaskCard failed on item', i, q, e);
            }
        });
    }

    if (isAdmin) document.getElementById('check-body').classList.add('is-admin');
}

function buildTaskCard(q) {
    const div = document.createElement('div');
    div.className = 'glass-card responsive-card';

    const statusMap = {
        working: { pill:'s-working', label:'กำลังทำ', qColor:'text-[#C9768A]' },
        waiting: { pill:'s-waiting', label:'รอคิว',   qColor:'text-[#A7C4A0]' },
        done:    { pill:'s-done',    label:'ส่งแล้ว', qColor:'text-[#A7D7B4]' },
    };
    const s = statusMap[q.status] || statusMap.waiting;

    const badgeClass = {
        working: 'bg-[#FFE4E8] text-[#8B4A5C]',
        waiting: 'bg-[#E8F0E3] text-[#6B8E5E]',
        done:    'bg-[#DDE8E0] text-[#5B9373]'
    };

    div.innerHTML = `
        <div class="p-4">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-3">
                    <span class="text-3xl font-bold ${s.qColor}">${q.queue_number}</span>
                    <div>
                        <span class="text-base font-bold text-gray-800 block leading-tight">${q.channel || '—'}</span>
                        <span class="text-[10px] text-gray-400">${q.sign_count || 0} ป้าย</span>
                    </div>
                </div>
                <span class="user-only ${badgeClass[q.status]||badgeClass.waiting} px-3 py-1 rounded-full text-[10px] font-bold flex-shrink-0">${s.label}</span>
                <div class="admin-only admin-status-btn ${s.pill} flex-shrink-0">
                    <div class="status-lines">
                        <div class="flex gap-1"><span class="sl-short"></span><span class="sl-long"></span></div>
                        <div class="flex gap-1"><span class="sl-short"></span><span class="sl-long"></span></div>
                        <div class="flex gap-1"><span class="sl-short"></span><span class="sl-long"></span></div>
                    </div>
                    <span class="status-label">${s.label}</span>
                    <select class="status-select-overlay" onchange="adminUpdateStatus(this,'${q.id}')">
                        <option value="working" ${q.status==='working'?'selected':''}>กำลังทำ</option>
                        <option value="waiting" ${q.status==='waiting'?'selected':''}>รอคิว</option>
                        <option value="done"    ${q.status==='done'   ?'selected':''}>ส่งแล้ว</option>
                    </select>
                </div>
            </div>
            <div class="user-only border-t border-gray-100 pt-2 grid grid-cols-2 gap-y-1 text-[10px]">
                <p>บรีฟ : <span class="text-[#8B4A5C] font-bold">${q.brief_status || '—'}</span></p>
                <p class="text-right">เริ่ม : <span class="font-bold">${fmtDate(q.start_date)}</span></p>
                <p>ส่งงาน : <span class="text-[#8B4A5C] font-bold">${fmtDate(q.deadline_date)}</span></p>
                <p class="text-right text-gray-300 italic">${fmtTime(q.updated_at)}</p>
            </div>
            <div class="admin-only border-t border-gray-100 pt-2 mt-1 flex flex-col gap-1.5">
                <div class="flex items-center gap-2 text-[10px]">
                    <span class="text-gray-400 w-14 flex-shrink-0">บรีฟ</span>
                    <select onchange="saveBrief(this,'${q.id}')"
                        class="flex-1 bg-rose-50 border border-rose-200 rounded-lg px-2 py-1 text-[10px] font-bold text-[#8B4A5C] outline-none font-['Mali']">
                        <option value="ยังไม่บรีฟ"   ${(q.brief_status||'')=== 'ยังไม่บรีฟ'  ?'selected':''}>ยังไม่บรีฟ</option>
                        <option value="บรีฟงานแล้ว" ${(q.brief_status||'')==='บรีฟงานแล้ว'?'selected':''}>บรีฟงานแล้ว</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 text-[10px]">
                    <span class="text-gray-400 w-14 flex-shrink-0">วันส่ง</span>
                    <input type="date" value="${q.deadline_date ? q.deadline_date.substring(0,10) : ''}"
                        onchange="saveDeadline(this,'${q.id}')"
                        class="flex-1 bg-rose-50 border border-rose-200 rounded-lg px-2 py-1 text-[10px] font-bold text-[#8B4A5C] outline-none font-['Mali']">
                </div>
                <p class="text-right text-gray-300 italic text-[9px]">${fmtTime(q.updated_at)}</p>
            </div>
        </div>
    `;
    return div;
}

// ─── ADMIN UPDATE STATUS ──────────────────────
async function adminUpdateStatus(select, qId) {
    const newStatus = select.value;
    const now = new Date().toISOString();
    const payload = { status:newStatus, updated_at:now };
    if (newStatus === 'working') payload.start_date = now;

    const btn = select.closest('.admin-status-btn');
    const labels = { working:'กำลังทำ', waiting:'รอคิว', done:'ส่งแล้ว' };
    btn.querySelector('.status-label').innerText = labels[newStatus] || newStatus;
    btn.className = `admin-only admin-status-btn s-${newStatus} flex-shrink-0`;

    const idx = allQueues.findIndex(q => q.id === qId);
    if (idx !== -1) allQueues[idx] = { ...allQueues[idx], ...payload };

    const { error } = await sb.from('queues').update(payload).eq('id', qId);
    if (error) showPopup('❌','อัพเดตไม่สำเร็จ');
}

// ─── INLINE EDIT (Admin) ──────────────────────
async function saveBrief(select, qId) {
    const { error } = await sb.from('queues')
        .update({ brief_status: select.value, updated_at: new Date().toISOString() })
        .eq('id', qId);
    if (error) showPopup('❌','บันทึกไม่สำเร็จ');
}

async function saveDeadline(input, qId) {
    const val = input.value;
    if (!val) return;
    const { error } = await sb.from('queues')
        .update({ deadline_date: val, updated_at: new Date().toISOString() })
        .eq('id', qId);
    if (error) showPopup('❌','บันทึกไม่สำเร็จ');
    else showPopup('✅','บันทึกวันส่งงานแล้ว!');
}

// ─── SEARCH ───────────────────────────────────
async function handleSearch() {
    const input = document.getElementById('search-input').value.trim();
    document.getElementById('clear-btn').classList.toggle('hidden', input === '');

    const receiptArea = document.getElementById('receipt-area');
    const filterSec   = document.getElementById('filter-section');
    const taskCont    = document.getElementById('task-container');

    if (input.length >= 2 && !input.toUpperCase().startsWith('Q') && isNaN(input)) {
        const { data } = await sb.from('queues')
            .select('*').ilike('shop_name',`%${input}%`)
            .order('created_at',{ascending:false}).limit(1);

        if (data && data.length > 0) {
            fillReceipt(data[0]);
            receiptArea.classList.remove('hidden');
            filterSec.classList.add('hidden');
            taskCont.style.opacity = '0.3';
            return;
        }
    }

    receiptArea.classList.add('hidden');
    filterSec.classList.remove('hidden');
    taskCont.style.opacity = '1';
    renderList();
}

function clearSearch() {
    document.getElementById('search-input').value = '';
    handleSearch();
}

// ─── RECEIPT ──────────────────────────────────
function fillReceipt(q) {
    currentReceiptId = q.id;
    document.getElementById('edit-q').innerText      = q.queue_number || '—';
    document.getElementById('edit-social').innerText = q.channel || '—';
    document.getElementById('edit-name').innerText   = q.shop_name || '—';
    document.getElementById('edit-start').innerText  = fmtDate(q.start_date);
    document.getElementById('edit-status').innerText =
        q.status === 'working' ? 'กำลังทำ' : q.status === 'done' ? 'ส่งแล้ว' : 'รอคิว';
    document.getElementById('edit-deadline').innerText = fmtDate(q.deadline_date);

    const itemsEl = document.getElementById('receipt-items');
    const items = Array.isArray(q.order_items) ? q.order_items : [];

    if (items.length > 0) {
        const total = items.reduce((s, i) => s + (parseFloat(i.price) || 0), 0);
        itemsEl.innerHTML = items.map(i => `
            <div class="flex justify-between gap-2">
                <span class="flex-1">${i.name}</span>
                <span class="flex-shrink-0 font-bold">${Number(i.price).toLocaleString()}</span>
            </div>
        `).join('');
        document.getElementById('edit-total').innerText = total.toLocaleString();
    } else {
        itemsEl.innerHTML = `<div class="text-gray-300 italic text-center text-[9px]">ยังไม่มีรายการสินค้า</div>`;
        document.getElementById('edit-total').innerText = q.total_price ? Number(q.total_price).toLocaleString() : '—';
    }
}

async function saveReceiptData() {
    if (!currentReceiptId) return;
    const statusText = document.getElementById('edit-status').innerText;
    const statusMap  = { 'กำลังทำ':'working', 'ส่งแล้ว':'done', 'รอคิว':'waiting' };
    const payload = {
        shop_name:     document.getElementById('edit-name').innerText,
        channel:       document.getElementById('edit-social').innerText,
        total_price:   document.getElementById('edit-total').innerText,
        deadline_date: document.getElementById('edit-deadline').innerText,
        status:        statusMap[statusText] || 'waiting',
        updated_at:    new Date().toISOString(),
    };
    const { error } = await sb.from('queues').update(payload).eq('id', currentReceiptId);
    if (error) showPopup('❌','บันทึกไม่สำเร็จ: ' + error.message);
    else       showPopup('✅','บันทึกข้อมูลสำเร็จ!');
}

// ─── FILTER ───────────────────────────────────
function setFilter(type) {
    currentFilter = type;
    const bg = document.getElementById('filter-bg');
    bg.style.left = type === 'all' ? '4px' : 'calc(50%)';
    document.getElementById('btn-all').className  = 'filter-btn ' + (type === 'all'  ? 'text-active-all'  : 'text-inactive');
    document.getElementById('btn-sent').className = 'filter-btn ' + (type === 'sent' ? 'text-active-sent' : 'text-inactive');
    renderList();
}
